aid: fibersense
name: FiberSense
description: 'FiberSense is a distributed fiber optic sensing (DFOS / distributed acoustic
  sensing) company that turns existing and purpose-built fiber optic cables into dense
  arrays of vibration and acoustic sensors for real-time detection, localization and
  classification of objects and events across critical infrastructure. Its AI/ML algorithms
  filter noise and false alarms in dense urban, marine and underground environments,
  delivered as a subscription-based sensing platform rather than a public developer
  API. Product lines include DigitalAsset (critical infrastructure asset protection),
  DigitalCity (urban infrastructure and utility monitoring), DigitalMarine (subsea
  and marine cable route monitoring) and DigitalLeak (pipeline leak detection). Backed
  by Prosus Ventures; customer support runs through an Atlassian service desk portal.'
